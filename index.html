<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBLIVION </title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.min.js"></script>
</head>
<body>
   
    <main>
        <div id="canvas-container">
            <div id="join-overlay" class="active">
                <div class="join-container">
                    <h1 class="oblivion-title">O B L I V I O N</h1>
                    <button id="join-button" class="join-button">H E L P · U S</button>
                    <p class="warning-text"> F I X  T H E  W O R L D </p>
                </div>
            </div>

            <div id="text-sequence-overlay" style="display: none;">
                <div class="text-sequence-container">
                    <p id="sequence-text" class="kh-vibrating-text"></p>
                    <div class="sequence-progress">
                        <div id="sequence-progress-fill" class="sequence-progress-fill"></div>
                    </div>
                </div>
            </div>
            
            <div id="visualizer-container" style="display: none; width: 100%; height: 100%;"> </div>

        </div>
    </main>

    <audio id="audioPlayer" loop style="display: none;"></audio>

    <script type="x-shader/x-vertex" id="vertexShader">
        uniform float u_time;
        uniform float u_audioData[32];
        uniform float u_audioAverage;
        uniform float u_bassLevel;
        uniform float u_midLevel;
        uniform float u_trebleLevel;
        
        varying float vDisplacement;
        varying float vNoise;
        
        // Noise functions (keeping these for distortion)
        vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 permute(vec4 x) { return mod289(((x * 34.0) + 10.0) * x); }
        vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
        
        float cnoise(vec3 P) {
            vec3 Pi0 = floor(P);
            vec3 Pi1 = Pi0 + vec3(1.0);
            Pi0 = mod289(Pi0);
            Pi1 = mod289(Pi1);
            vec3 Pf0 = fract(P);
            vec3 Pf1 = Pf0 - vec3(1.0);
            vec4 ix = vec4(Pi0.x, Pi1.x, Pi0.x, Pi1.x);
            vec4 iy = vec4(Pi0.yy, Pi1.yy);
            vec4 iz0 = Pi0.zzzz;
            vec4 iz1 = Pi1.zzzz;
            
            vec4 ixy = permute(permute(ix) + iy);
            vec4 ixy0 = permute(ixy + iz0);
            vec4 ixy1 = permute(ixy + iz1);
            
            vec4 gx0 = ixy0 * (1.0 / 7.0);
            vec4 gy0 = fract(floor(gx0) * (1.0 / 7.0)) - 0.5;
            gx0 = fract(gx0);
            vec4 gz0 = vec4(0.5) - abs(gx0) - abs(gy0);
            vec4 sz0 = step(gz0, vec4(0.0));
            gx0 -= sz0 * (step(0.0, gx0) - 0.5);
            gy0 -= sz0 * (step(0.0, gy0) - 0.5);
            
            vec4 gx1 = ixy1 * (1.0 / 7.0);
            vec4 gy1 = fract(floor(gx1) * (1.0 / 7.0)) - 0.5;
            gx1 = fract(gx1);
            vec4 gz1 = vec4(0.5) - abs(gx1) - abs(gy1);
            vec4 sz1 = step(gz1, vec4(0.0));
            gx1 -= sz1 * (step(0.0, gx1) - 0.5);
            gy1 -= sz1 * (step(0.0, gy1) - 0.5);
            
            vec3 g000 = vec3(gx0.x, gy0.x, gz0.x);
            vec3 g100 = vec3(gx0.y, gy0.y, gz0.y);
            vec3 g010 = vec3(gx0.z, gy0.z, gz0.z);
            vec3 g110 = vec3(gx0.w, gy0.w, gz0.w);
            vec3 g001 = vec3(gx1.x, gy1.x, gz1.x);
            vec3 g101 = vec3(gx1.y, gy1.y, gz1.y);
            vec3 g011 = vec3(gx1.z, gy1.z, gz1.z);
            vec3 g111 = vec3(gx1.w, gy1.w, gz1.w);
            
            vec4 norm0 = taylorInvSqrt(vec4(dot(g000, g000), dot(g010, g010), dot(g100, g100), dot(g110, g110)));
            g000 *= norm0.x;
            g010 *= norm0.y;
            g100 *= norm0.z;
            g110 *= norm0.w;
            vec4 norm1 = taylorInvSqrt(vec4(dot(g001, g001), dot(g011, g011), dot(g101, g101), dot(g111, g111)));
            g001 *= norm1.x;
            g011 *= norm1.y;
            g101 *= norm1.z;
            g111 *= norm1.w;
            
            float n000 = dot(g000, Pf0);
            float n100 = dot(g100, vec3(Pf1.x, Pf0.yz));
            float n010 = dot(g010, vec3(Pf0.x, Pf1.y, Pf0.z));
            float n110 = dot(g110, vec3(Pf1.xy, Pf0.z));
            float n001 = dot(g001, vec3(Pf0.xy, Pf1.z));
            float n101 = dot(g101, vec3(Pf1.x, Pf0.y, Pf1.z));
            float n011 = dot(g011, vec3(Pf0.x, Pf1.yz));
            float n111 = dot(g111, Pf1);
            
            vec3 fade_xyz = Pf0 * Pf0 * Pf0 * (Pf0 * (Pf0 * 6.0 - 15.0) + 10.0);
            vec4 n_z = mix(vec4(n000, n100, n010, n110), vec4(n001, n101, n011, n111), fade_xyz.z);
            vec2 n_yz = mix(n_z.xy, n_z.zw, fade_xyz.y);
            float n_xyz = mix(n_yz.x, n_yz.y, fade_xyz.x);
            
            return 2.2 * n_xyz;
        }
        
        void main() {
            // Get audio levels for displacement
            float bass = u_bassLevel * 3.0;
            float mid = u_midLevel * 2.0;
            float treble = u_trebleLevel * 1.5;
            float audioInfluence = (u_audioAverage * 2.0) + bass + (mid * 0.5);
            
            // Multiple layers of noise for chaotic displacement
            float noise1 = cnoise(position * 1.2 + vec3(u_time * 1.5, u_time * 0.8, u_time * 1.2));
            float noise2 = cnoise(position * 2.5 + vec3(u_time * 2.0, -u_time * 1.5, u_time * 1.8));
            float noise3 = cnoise(position * 4.0 + vec3(-u_time * 2.5, u_time * 2.0, u_time * 2.2));
            
            // Combine noises with audio influence
            float combinedNoise = (noise1 * 0.5 + noise2 * 0.3 + noise3 * 0.2);
            vNoise = combinedNoise;
            
            // Calculate displacement with extreme audio reactivity
            float audioPush = bass * 1.5 + mid * 0.8 + treble * 0.4;
            float displacement = (combinedNoise * 0.8) + (audioPush * 1.2);
            vDisplacement = displacement;
            
            // Add spikes and extrusions based on bass
            float spikeFactor = max(0.0, sin(position.x * 3.0 + u_time * 5.0) * bass * 2.0);
            displacement += spikeFactor;
            
            // Create new position with displacement along normal
            vec3 newPosition = position + normal * displacement;
            
            // Final position
            gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
        }
    </script>
        
    <script type="x-shader/x-fragment" id="fragmentShader">
        uniform float u_time;
        uniform float u_audioAverage;
        uniform float u_bassLevel;
        uniform float u_midLevel;
        uniform int u_colorMode; // 0: White, 1: Red, 2: Gradient, 3: Pulsing
        
        varying float vDisplacement;
        varying float vNoise;
        
        void main() {
            // Base colors
            vec3 white = vec3(1.0, 1.0, 1.0);        // #FFFFFF
            vec3 red = vec3(0.643, 0.047, 0.173);    // #A40C2C converted to 0-1 range
            
            vec3 finalColor;
            
            // Mode 0: Pure White
            if (u_colorMode == 0) {
                finalColor = white;
            }
            // Mode 1: Pure Red
            else if (u_colorMode == 1) {
                finalColor = red;
            }
            // Mode 2: Gradient based on displacement/audio
            else if (u_colorMode == 2) {
                float mixFactor = clamp(vDisplacement * 0.8 + u_audioAverage * 0.5 + vNoise * 0.2, 0.0, 1.0);
                finalColor = mix(white, red, mixFactor);
            }
            // Mode 3: Pulsing switch based on bass
            else {
                // Use bass to create pulsing effect
                float pulse = sin(u_time * 5.0 + vNoise * 10.0) * 0.5 + 0.5;
                // Add audio influence
                pulse = mix(pulse, u_bassLevel * 2.0, 0.5);
                pulse = clamp(pulse, 0.0, 1.0);
                
                // Interpolate between white and red based on pulse
                finalColor = mix(white, red, pulse);
            }
            
            // Add subtle brightness variation based on audio for depth
            float brightness = 0.8 + u_audioAverage * 0.4 + u_bassLevel * 0.3;
            finalColor *= brightness;
            
            // Output final color
            gl_FragColor = vec4(finalColor, 1.0);
        }
    </script>

    <script src="initiation.js"></script>
    <script src="visualizer.js"></script>
</body>
</html>
